name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  python-tests:
    name: Python 测试（pytest 全量）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rag-python/requirements.txt
      - name: 安装依赖（锁文件）
        run: pip install -r requirements.txt
      - name: 运行测试
        run: |
          python -X utf8 -m pytest -q --no-header -p no:cacheprovider
      - name: 上传测试报告（失败时可查）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: rag-python/.pytest_cache/

  frontend-build:
    name: 前端构建（npm build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: rag-frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 构建
        run: npm run build

  java-compile:
    name: Java 网关编译（mvn compile）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: 编译
        run: mvn -q compile

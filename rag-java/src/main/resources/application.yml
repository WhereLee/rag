server:
  port: 8082

spring:
  application:
    name: rag-gateway
  datasource:
    url: jdbc:postgresql://localhost:5432/rag_kb
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    hikari:
      maximum-pool-size: 5       # cloud 4C4G 缩减（master=10）
      minimum-idle: 2

gateway:
  python:
    base-url: http://127.0.0.1:8090
  jwt:
    secret: ${GATEWAY_JWT_SECRET:rag-gateway-local-dev-secret-change-me}
    ttl-hours: 8
  rate-limit:
    per-minute: 20
  internal-api-key: ${GATEWAY_INTERNAL_API_KEY:rag-internal-dev-key-2026}
  cors:
    allowed-origins: ${GATEWAY_CORS_ORIGINS:http://localhost:3000}

logging:
  level:
    com.rag: INFO
